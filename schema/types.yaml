# The type registry: what JSON Schema can't say about each record type.
# The shape of each type's fields is in <type-in-kebab-case>.json beside this file.
# Design: docs/context-graph/01-model.md (the model) and 03-implementation.md, section 3.
#
# prefix            ID prefix: bel for bel_7k3m9q.
# layer             knowing, committing or scope.
# revisable         Whether the record keeps a `revisions` list.
# revisions_inline  Old wording kept in the file (short records) or left to git (long ones).
# meaning           Fields a fingerprint covers. `body` stands for the body.
# identity          Fields that suggest two records are the same thing (validate warns).
# edges             Edge name -> to: target types (`any` for any type),
#                   propagates: a change in the target means this record needs a re-check,
#                   pinned: the link records the target's revision and fingerprint.
#                   pinned defaults to propagates. Only revisable targets are ever pinned,
#                   so a pinned edge to an initiative stays bare.
# subrecords        Header field holding a list of sub-records, each with its own short id.
# template          Header lines `mason new` writes after id and title. {title}, {slug} and {today} are replaced.
# body              Body `mason new` writes.

common_edges:
  mentions: {to: [any], propagates: false}

types:
  # ---- knowing layer ----

  actor:
    prefix: who
    layer: knowing
    meaning: [title, kind]
    identity: [title]
    edges:
      acts_for: {to: [actor], propagates: false}
      interested_in: {to: [any], propagates: false}
    template: |
      kind: person

  artifact:
    prefix: art
    layer: knowing
    meaning: [title, kind, url, commit]
    identity: [url]
    edges:
      attributed_to: {to: [actor], propagates: false}
    template: |
      kind: document
      url: ""

  activity:
    prefix: actv
    layer: knowing
    meaning: [title, started_at]
    edges:
      associated_with: {to: [actor], propagates: false}
      part_of: {to: [initiative], propagates: false}
      corresponds_to: {to: [step], propagates: false}
    template: |
      started_at: {today}
      associated_with: []

  evidence:
    prefix: ev
    layer: knowing
    meaning: [body]
    edges:
      from: {to: [actor, artifact, finding], propagates: false, pinned: true}
      generated_by: {to: [activity], propagates: false}
      about: {to: [any], propagates: false}
      undermines: {to: [evidence], propagates: false}
      undercuts: {to: [support_link], propagates: false}
    template: |
      observed_at: {today}
      from: []
      generated_by: []
    body: |
      The verbatim quote or observation. Never edited once written.

  belief:
    prefix: bel
    layer: knowing
    revisable: true
    revisions_inline: true
    meaning: [claim]
    identity: [claim]
    edges:
      answers: {to: [question], propagates: false}
    subrecords:
      support:
        type: support_link
        edges:
          evidence: {to: [evidence], propagates: false}
    template: |
      claim: {title}
      status: held
      asserted_by: agent
      support: []

  finding:
    prefix: fnd
    layer: knowing
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      generated_by: {to: [activity], propagates: false}

  question:
    prefix: q
    layer: knowing
    revisable: true
    revisions_inline: true
    meaning: [question]
    identity: [question]
    edges:
      part_of: {to: [initiative], propagates: false}
      questions: {to: [any], propagates: false}
    subrecords:
      options:
        type: option
        edges:
          for: {to: [belief], propagates: false}
          against: {to: [belief], propagates: false}
    template: |
      question: {title}
      part_of: []
      options: []

  # ---- scope ----

  initiative:
    prefix: ini
    layer: scope
    meaning: [title, purpose, goals]
    identity: [slug]
    edges:
      involves: {to: [actor], propagates: false}
    template: |
      slug: {slug}
      status: active
      purpose: ""
      goals: []
      involves: []
    body: |
      Purpose and goals, in more detail.

  # ---- committing layer ----

  prd:
    prefix: prd
    layer: committing
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []

  requirement:
    prefix: req
    layer: committing
    revisable: true
    revisions_inline: true
    meaning: [statement]
    identity: [statement]
    edges:
      part_of: {to: [prd, initiative], propagates: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      statement: {title}
      status: proposed
      part_of: []

  decision:
    prefix: dec
    layer: committing
    revisable: true
    revisions_inline: false
    meaning: [title, criteria, confirmation, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      answers: {to: [question], propagates: false}
      chooses: {to: [option], propagates: false}
      decided_by: {to: [actor], propagates: false}
      consults: {to: [actor], propagates: false}
      informs: {to: [actor], propagates: false}
      supersedes: {to: [decision], propagates: false}
      amends: {to: [decision], propagates: false}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []
      answers: []
      chooses: []
      criteria: []

  design_doc:
    prefix: dd
    layer: committing
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      elaborates: {to: [prd, requirement], propagates: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []
      elaborates: []

  task:
    prefix: task
    layer: committing
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      implements: {to: [requirement], propagates: true}
      derived_from: {to: [design_doc], propagates: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []
      implements: []
      derived_from: []
    body: |
      ## Outcome

      ## Approach

  plan:
    prefix: plan
    layer: committing
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      derived_from: {to: [task], propagates: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      derived_from: []

  step:
    prefix: step
    layer: committing
    revisable: true
    revisions_inline: true
    meaning: [title, body]
    edges:
      part_of: {to: [plan], propagates: true}
      follows: {to: [step], propagates: false}
    template: |
      part_of: []
    body: |
      Exact files, the pattern to copy, and the one check that shows it worked.
