# The type registry: what JSON Schema can't say about each record type.
# The shape of each type's fields is in <type-in-kebab-case>.json beside this file.
# Design: docs/context-graph/01-model.md (the model) and 03-implementation.md, section 3.
#
# prefix            ID prefix: bel for bel_7k3m9q.
# layer             knowing, committing or scope.
# revisable         Whether the record keeps a `revisions` list.
# document          Marks a type as prose we wrote (finding, design doc, PRD, plan). Evidence can quote
#                   any of them: an edge's `to` may name `document`. Loading checks that a document
#                   is revisable with revisions left to git, has title and body in `meaning`, and has
#                   generated_by (to activity) and attributed_to (to actor) edges and schema fields.
# fixed             The record never changes once written, and keeps its own fingerprint in an `fp`
#                   header field, which `mason sync` writes. Validate errors when it stops matching.
#                   A record is either revisable or fixed, never both; loading refuses a fixed type
#                   that is revisable or whose schema has no `fp`. Optional.
# revisions_inline  Old wording kept in the file (short records) or left to git (long ones).
# meaning           Fields a fingerprint covers. `body` stands for the body.
# identity          Fields that suggest two records are the same thing (validate warns).
# edges             Edge name -> to: target types (`any` for any type, `document` for any document type),
#                   propagates: a change in the target means this record needs a re-check,
#                   pinned: the link records the target's revision and fingerprint.
#                   pinned defaults to propagates. Only revisable targets are ever pinned,
#                   so a pinned edge to an initiative stays bare.
# fallen            Statuses (from the type's schema) that mean the record no longer holds.
#                   A propagating link from a committing record to a record in one of
#                   them reopens the committing record. Optional.
# sealed            When the current revision is sealed by state, not only by a pin (a pinned
#                   revision is sealed whatever this says). Optional, with up to three parts:
#                   status: statuses (from the type's schema) at which it is sealed;
#                   settled: true seals it once a link settles it (a question has no status);
#                   via: an edge of the type; status then names statuses of the record
#                   that edge leads to (a step is sealed by its plan's status).
# closed            Statuses (from the type's schema) that mean the record is no longer in force.
#                   A committing record in one of them isn't reopened by a fallen target. Optional.
# settles           On an edge: statuses of the source (from its type's schema) at which the link
#                   settles its target. A record with an incoming link that settles it is settled;
#                   an open question is one that isn't. Optional.
# pending           On an edge: statuses of the source (from its type's schema) at which the link is
#                   an answer still waiting to settle its target. Optional.
# within            On an edge: names another edge of the same type. The target's parent record must be a
#                   target of the record's edge of that name: `within: answers` on decision.chooses means
#                   the chosen option's question must be one the same decision answers. Validate warns.
#                   Optional.
# target_status     On an edge: statuses (from every target type's schema) the target should be in
#                   (supersedes -> superseded). Validate warns when it isn't. Optional.
# one_in_force      On an edge: at most one source in force (status not closed; for an edge that
#                   settles, one that settles) per target. Validate warns on a second. Optional.
# subrecords        Header field holding a list of sub-records, each with its own short id.
# template          Header lines `mason new` writes after id and title. {title}, {slug} and {today} are replaced.
# body              Body `mason new` writes.

common_edges:
  mentions: {to: [any], propagates: false}

types:
  # ---- knowing layer ----

  actor:
    prefix: who
    layer: knowing
    meaning: [title, kind]
    identity: [title]
    edges:
      acts_for: {to: [actor], propagates: false}
    template: |
      kind: person

  artifact:
    prefix: art
    layer: knowing
    meaning: [title, kind, url, commit]
    identity: [url]
    edges:
      attributed_to: {to: [actor], propagates: false}
    template: |
      kind: page
      url: ""

  activity:
    prefix: actv
    layer: knowing
    meaning: [title, started_at]
    identity: [session]
    edges:
      associated_with: {to: [actor], propagates: false}
      part_of: {to: [initiative], propagates: false}
      corresponds_to: {to: [step], propagates: false}
    template: |
      started_at: {today}
      associated_with: []

  evidence:
    prefix: ev
    layer: knowing
    fixed: true
    meaning: [body]
    edges:
      from: {to: [actor, artifact, document], propagates: false, pinned: true}
      generated_by: {to: [activity], propagates: false}
      about: {to: [any], propagates: false}
      undermines: {to: [evidence], propagates: false}
      undercuts: {to: [support_link], propagates: false}
    template: |
      observed_at: {today}
      from: []
    body: |
      The verbatim quote or observation. Never edited once written.

  belief:
    prefix: bel
    layer: knowing
    revisable: true
    revisions_inline: true
    meaning: [claim]
    identity: [claim]
    fallen: [incorrect, insufficient]
    closed: [withdrawn]
    edges:
      answers: {to: [question], propagates: false, settles: [held]}
    subrecords:
      support:
        type: support_link
        edges:
          evidence: {to: [evidence], propagates: false}
    template: |
      claim: {title}
      status: held
      asserted_by: agent
      support: []

  finding:
    prefix: fnd
    layer: knowing
    document: true
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      generated_by: {to: [activity], propagates: false}
      attributed_to: {to: [actor], propagates: false}

  question:
    prefix: q
    layer: knowing
    sealed: {settled: true}
    revisable: true
    revisions_inline: true
    meaning: [question]
    identity: [question]
    edges:
      part_of: {to: [initiative], propagates: false}
      questions: {to: [any], propagates: false}
    subrecords:
      options:
        type: option
        edges:
          for: {to: [belief], propagates: false}
          against: {to: [belief], propagates: false}
    template: |
      question: {title}
      part_of: []
      options: []

  # ---- scope ----

  initiative:
    prefix: ini
    layer: scope
    meaning: [title, purpose, goals]
    identity: [slug]
    edges:
      involves: {to: [actor], propagates: false}
    template: |
      slug: {slug}
      status: active
      purpose: ""
      goals: []
      involves: []
    body: |
      Purpose and goals, in more detail.

  # ---- committing layer ----

  prd:
    prefix: prd
    layer: committing
    document: true
    closed: [rejected, deprecated, superseded]
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      generated_by: {to: [activity], propagates: false}
      attributed_to: {to: [actor], propagates: false}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []

  requirement:
    prefix: req
    layer: committing
    closed: [rejected, deprecated, superseded]
    revisable: true
    revisions_inline: true
    meaning: [statement]
    identity: [statement]
    edges:
      part_of: {to: [prd, initiative], propagates: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      statement: {title}
      status: proposed
      part_of: []

  decision:
    prefix: dec
    layer: committing
    closed: [rejected, deprecated, superseded]
    sealed: {status: [accepted, rejected, deprecated, superseded]}
    revisable: true
    revisions_inline: false
    meaning: [title, criteria, confirmation, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      answers: {to: [question], propagates: false, settles: [accepted], pending: [proposed, leaning], one_in_force: true}
      chooses: {to: [option], propagates: false, within: answers}
      decided_by: {to: [actor], propagates: false}
      consults: {to: [actor], propagates: false}
      informs: {to: [actor], propagates: false}
      supersedes: {to: [decision], propagates: false, target_status: [superseded]}
      amends: {to: [decision], propagates: false}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []
      answers: []
      chooses: []
      criteria: []

  design_doc:
    prefix: dd
    layer: committing
    document: true
    closed: [rejected, deprecated, superseded]
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      generated_by: {to: [activity], propagates: false}
      attributed_to: {to: [actor], propagates: false}
      elaborates: {to: [prd, requirement], propagates: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []
      elaborates: []

  task:
    prefix: task
    layer: committing
    closed: [rejected, deprecated, superseded]
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      implements: {to: [requirement], propagates: true}
      derived_from: {to: [design_doc], propagates: true}
      blocked_by: {to: [any], propagates: false}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      progress: todo
      part_of: []
      implements: []
      derived_from: []
    body: |
      ## Outcome

      ## Approach

  plan:
    prefix: plan
    layer: committing
    document: true
    closed: [rejected, deprecated, superseded]
    revisable: true
    revisions_inline: false
    meaning: [title, body]
    edges:
      part_of: {to: [initiative], propagates: false}
      generated_by: {to: [activity], propagates: false}
      attributed_to: {to: [actor], propagates: false}
      derived_from: {to: [task], propagates: true, one_in_force: true}
      relies_on: {to: [belief], propagates: true}
    template: |
      status: proposed
      part_of: []
      derived_from: []

  step:
    prefix: step
    layer: committing
    sealed: {via: part_of, status: [accepted, rejected, deprecated, superseded]}
    revisable: true
    revisions_inline: true
    meaning: [title, body]
    edges:
      part_of: {to: [plan], propagates: true}
      follows: {to: [step], propagates: false}
    template: |
      part_of: []
    body: |
      Exact files, the pattern to copy, and the one check that shows it worked.
